services:
  plaza:
    build: ./server
    environment:
      AGORE_ADDR: ":8081"
      AGORE_TOKEN: "${AGORE_TOKEN}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    expose:
      - "8081"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      plaza:
        condition: service_healthy
    ports:
      - "8081:443"
    volumes:
      - ./server/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
